server {
    listen 8080;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    include /etc/nginx/security-headers.conf;

    server_tokens off;
    client_max_body_size 15m;

    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;

    location = /healthz {
        access_log off;
        add_header Content-Type text/plain;
        return 200 "ok\n";
    }

    # Hashed asset filenames are safe to cache forever.
    location /assets/ {
        include /etc/nginx/security-headers.conf;
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # Uploaded gallery photos, served straight off the shared volume so the bytes
    # never travel through Node. Filenames carry a random suffix, so a given URL
    # never changes content.
    location /images/gallery/ {
        include /etc/nginx/security-headers.conf;
        alias /srv/uploads/gallery/;
        expires 1y;
        add_header Cache-Control "public, immutable";
        location ~* \.(webp|jpe?g|png|avif)$ {
            include /etc/nginx/security-headers.conf;
            try_files $uri =404;
        }
        return 404;
    }

    location /api/ {
        proxy_pass http://api:4000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 30s;
    }

    # SPA fallback — every unknown path renders the client router.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # try_files above lands here for every SPA route, so this location serves the
    # actual HTML document — the one response that most needs the headers.
    location = /index.html {
        include /etc/nginx/security-headers.conf;
        add_header Cache-Control "no-cache, must-revalidate";
    }
}
