<!doctype html>
<html lang="sk">
    <head>
        <meta charset="utf-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1" />
        <title>Svadobný salón Jarka Galanta — svadobné a spoločenské šaty</title>
        <meta
            name="description"
            content="Svadobné, spoločenské a prijímacie šaty, obleky pre ženíchov aj doplnky. Salón v Galante od roku 2007. Objednajte si termín skúšky."
        />
        <meta name="theme-color" content="#fdfcfa" />
        <meta name="robots" content="index, follow" />
        <meta name="author" content="Svadobný salón Jarka" />
        <meta name="geo.region" content="SK-TA" />
        <meta name="geo.placename" content="Galanta" />

        <!-- usePageMeta rewrites canonical, description and the og:/twitter: pairs per route.
             These are the values a crawler sees before the bundle runs. -->
        <link rel="canonical" href="https://svadobnysalonjarka.sk/" />
        <meta property="og:type" content="website" />
        <meta property="og:site_name" content="Svadobný salón Jarka" />
        <meta property="og:locale" content="sk_SK" />
        <meta property="og:title" content="Svadobný salón Jarka Galanta" />
        <meta
            property="og:description"
            content="Svadobné, spoločenské a prijímacie šaty, obleky pre ženíchov aj doplnky. Salón v Galante od roku 2007."
        />
        <meta property="og:image" content="https://svadobnysalonjarka.sk/assets/hero.webp" />
        <meta property="og:image:alt" content="Nevesta vo svadobných šatách v salóne Jarka" />
        <meta property="og:url" content="https://svadobnysalonjarka.sk/" />
        <meta name="twitter:card" content="summary_large_image" />

        <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
        <!-- Self-hosted: the Google Fonts stylesheet blocked the first paint by ~880ms on a
             cross-origin round trip, and it handed every visitor's IP to Google. The faces
             live in src/styles/fonts.less; only the two the first screen actually renders
             are preloaded, the rest resolve from the bundled CSS. -->
        <link rel="preload" as="font" type="font/woff2" href="/fonts/jost-300-normal-latin.woff2" crossorigin />
        <link
            rel="preload"
            as="font"
            type="font/woff2"
            href="/fonts/cormorant-garamond-400-normal-latin.woff2"
            crossorigin
        />
        <!-- The hero is the LCP element on every first visit; without this it waits on the CSS. -->
        <link rel="preload" as="image" href="/assets/hero.webp" fetchpriority="high" />
    </head>
    <body>
        <div id="root"></div>
        <script type="module" src="/src/main.tsx"></script>
    </body>
</html>
