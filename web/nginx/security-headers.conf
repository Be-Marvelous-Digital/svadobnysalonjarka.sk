# Security headers for every response nginx serves, kept in one file because nginx's
# add_header inheritance is a footgun: a location that declares ANY add_header
# of its own silently discards every header inherited from the server block.
# Every location below that sets a header of its own must `include` this too.

add_header X-Content-Type-Options "nosniff" always;
add_header X-Frame-Options "DENY" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), interest-cohort=()" always;

# helmet's CSP only reaches API responses from Node, never the HTML pages that
# actually execute scripts.
#
#   script-src  'unsafe-inline' for the inline RSC payload Next.js streams into
#               every page; nonces would force dynamic rendering and lose ISR
#   style-src   'unsafe-inline' for the inline styles React writes for CSS
#               custom properties
#   font-src    the self-hosted woff2 files, and data: for inlined subsets
#   img-src     own uploads and externally linked gallery photos
#   frame-src   the Google Maps embed on the contact page
add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; font-src 'self' data:; img-src 'self' https: data: blob:; connect-src 'self'; frame-src https://www.google.com https://maps.google.com; frame-ancestors 'none'; base-uri 'none'; object-src 'none'; form-action 'self'" always;
