server {
    listen 8080;
    server_name _;

    root /app/web/public;

    include /etc/nginx/security-headers.conf;

    server_tokens off;
    # Default for pages. The gallery upload endpoint raises this — see /api/.
    client_max_body_size 1m;

    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;

    location = /healthz {
        access_log off;
        add_header Content-Type text/plain;
        return 200 "ok\n";
    }

    # Next's build output; content-hashed names, so safe to cache forever.
    location /_next/static/ {
        include /etc/nginx/security-headers.conf;
        alias /app/web/.next/static/;
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # Bundled photos. Names are stable, not hashed, so revalidate after a day.
    location /assets/ {
        include /etc/nginx/security-headers.conf;
        add_header Cache-Control "public, max-age=86400";
        try_files $uri =404;
    }

    # Self-hosted webfonts. The names encode family, weight, style and subset, so a
    # different face is a different URL and these bytes never change.
    location /fonts/ {
        include /etc/nginx/security-headers.conf;
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # The hero lives at one fixed URL because the home page preloads it and CSS
    # references it. try_files falls through to the bundled photo while the slot
    # is unset, so the preload is valid either way. Revalidated rather than immutable: the URL stays the
    # same when the salon replaces the photo, so the bytes have to be checked.
    location = /images/site/hero.webp {
        include /etc/nginx/security-headers.conf;
        root /srv/uploads;
        add_header Cache-Control "public, max-age=300, must-revalidate";
        try_files /site/hero.webp @hero_default;
    }

    # A named location, not a plain /assets/hero.webp fallback: that would be an
    # internal redirect into the location below, and the response would come back
    # marked immutable for a year under a URL whose content can change.
    location @hero_default {
        include /etc/nginx/security-headers.conf;
        root /app/web/public;
        add_header Cache-Control "public, max-age=300, must-revalidate";
        try_files /assets/hero.webp =404;
    }

    # Everything else uploaded into a fixed position on a page. Random filenames,
    # so these can be cached like the gallery.
    location /images/site/ {
        include /etc/nginx/security-headers.conf;
        alias /srv/uploads/site/;
        expires 1y;
        add_header Cache-Control "public, immutable";
        location ~* \.(webp|jpe?g|png|avif)$ {
            include /etc/nginx/security-headers.conf;
            try_files $uri =404;
        }
        return 404;
    }

    # Uploaded gallery photos, served straight off the shared volume so the bytes
    # never travel through Node. Filenames carry a random suffix, so a given URL
    # never changes content.
    location /images/gallery/ {
        include /etc/nginx/security-headers.conf;
        alias /srv/uploads/gallery/;
        expires 1y;
        add_header Cache-Control "public, immutable";
        location ~* \.(webp|jpe?g|png|avif)$ {
            include /etc/nginx/security-headers.conf;
            try_files $uri =404;
        }
        return 404;
    }

    location /api/ {
        # 0 disables the check. Uploads are unbounded by design: the API streams them
        # to a temp file and re-encodes to a size-bounded WebP, so nothing here has to
        # fit in memory. The request body timeout below is what stops a stalled upload.
        client_max_body_size 0;
        client_body_timeout 300s;
        proxy_request_buffering off;

        proxy_pass http://api:4000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 30s;
    }

    # Only the API may trigger it, over the internal network.
    location = /revalidate {
        return 404;
    }

    location = /favicon.svg {
        include /etc/nginx/security-headers.conf;
        add_header Cache-Control "public, max-age=86400";
    }

    # Pages, sitemap and robots are rendered by Next.
    location / {
        include /etc/nginx/security-headers.conf;
        proxy_pass http://site:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 30s;
    }
}
