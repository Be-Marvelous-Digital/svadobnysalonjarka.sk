name: CI

on:
    push:
        branches: [main, master]
    pull_request:
    workflow_dispatch:

# A new push to the same branch cancels the previous run.
concurrency:
    group: ${{ github.workflow }}-${{ github.ref }}
    cancel-in-progress: true

permissions:
    contents: read

env:
    NODE_VERSION: '22'

jobs:
    backend:
        name: Backend checks
        runs-on: ubuntu-latest
        defaults:
            run:
                working-directory: backend
        steps:
            - uses: actions/checkout@v4

            - uses: actions/setup-node@v4
              with:
                  node-version: ${{ env.NODE_VERSION }}
                  cache: npm
                  cache-dependency-path: backend/package-lock.json

            - run: npm ci
            - name: Lint
              run: npm run lint
            - name: Format check
              run: npm run format:check
            - name: Typecheck
              run: npm run typecheck
            - name: Build
              run: npm run build

    frontend:
        name: Frontend checks
        runs-on: ubuntu-latest
        defaults:
            run:
                working-directory: frontend
        steps:
            - uses: actions/checkout@v4

            - uses: actions/setup-node@v4
              with:
                  node-version: ${{ env.NODE_VERSION }}
                  cache: npm
                  cache-dependency-path: frontend/package-lock.json

            - run: npm ci
            - name: Lint
              run: npm run lint
            - name: Format check
              run: npm run format:check
            - name: Typecheck
              run: npm run typecheck
            - name: Build
              run: npm run build

    images:
        name: Build and push image
        runs-on: ubuntu-latest
        needs: [backend, frontend]
        # Pushing a real, pullable image is only worth doing for real branch pushes.
        if: github.event_name == 'push'
        permissions:
            contents: read
            # Publishing to GHCR needs the token's package scope, which is not part
            # of the read-only default set at the top of this file.
            packages: write
        steps:
            - uses: actions/checkout@v4

            - uses: docker/setup-buildx-action@v3

            - name: Log in to GHCR
              uses: docker/login-action@v3
              with:
                  registry: ghcr.io
                  username: ${{ github.actor }}
                  password: ${{ secrets.GITHUB_TOKEN }}

            # GHCR requires an all-lowercase image path; github.repository preserves
            # the repo's actual case, so building the tag by hand would break the
            # push. metadata-action normalises it.
            - name: Docker metadata
              id: meta
              uses: docker/metadata-action@v5
              with:
                  images: ghcr.io/${{ github.repository }}
                  # prefix= (empty) on the sha tag overrides metadata-action's default
                  # `sha-` prefix, so the tag is the bare 40-char commit sha — the
                  # `deploy` job below pulls by that exact sha via `github.sha`.
                  tags: |
                      type=raw,value=latest
                      type=sha,format=long,prefix=

            - name: Build and push
              uses: docker/build-push-action@v6
              with:
                  context: .
                  file: Dockerfile
                  push: true
                  tags: ${{ steps.meta.outputs.tags }}
                  labels: ${{ steps.meta.outputs.labels }}
                  cache-from: type=gha,scope=app
                  cache-to: type=gha,mode=max,scope=app

    deploy:
        name: Deploy
        runs-on: ubuntu-latest
        needs: [images]
        # `needs: [images]` already means backend, frontend and the image
        # build+push all succeeded. The only extra condition is branch: deploy off
        # main only, never master, never a PR.
        if: github.ref == 'refs/heads/main'
        permissions: {}
        steps:
            - name: Deploy over SSH
              uses: appleboy/ssh-action@v1
              with:
                  host: ${{ secrets.DEPLOY_HOST }}
                  username: ${{ secrets.DEPLOY_USER }}
                  key: ${{ secrets.DEPLOY_SSH_KEY }}
                  script: /opt/svadobnysalonjarka/svadobnysalonjarka.sk/deploy/deploy.sh ${{ github.sha }}
